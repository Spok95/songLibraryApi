basePath: /
definitions:
  models.Song:
    type: object
  models.SongResponse:
    properties:
      group:
        type: string
      id:
        type: integer
      link:
        type: string
      releaseDate:
        type: string
      song:
        type: string
      text:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: kostya2211@yandex.ru
    name: Konstantin
    url: https://github.com/Spok95
  description: API для управления онлайн-библиотекой песен
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Song Library API
  version: "1.0"
paths:
  /songs:
    get:
      description: Возвращает список всех песен с фильтрацией и пагинацией
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.SongResponse'
            type: array
      summary: Получить список песен
      tags:
      - Songs
    post:
      consumes:
      - application/json
      description: Создаёт новую песню и обогащает её данными
      parameters:
      - description: Данные песни
        in: body
        name: song
        required: true
        schema:
          $ref: '#/definitions/models.Song'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.SongResponse'
        "400":
          description: Invalid input
          schema:
            type: string
      summary: Добавить песню
      tags:
      - Songs
  /songs/{id}:
    delete:
      description: Удаляет песню из базы данных
      parameters:
      - description: ID песни
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Song not found
          schema:
            type: string
      summary: Удалить песню
      tags:
      - Songs
    get:
      description: Возвращает данные о конкретной песне по её ID
      parameters:
      - description: ID песни
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SongResponse'
        "404":
          description: Song not found
          schema:
            type: string
      summary: Получить песню
      tags:
      - Songs
    put:
      consumes:
      - application/json
      description: Изменяет информацию о песне по ID
      parameters:
      - description: ID песни
        in: path
        name: id
        required: true
        type: integer
      - description: Обновлённые данные
        in: body
        name: song
        required: true
        schema:
          $ref: '#/definitions/models.Song'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SongResponse'
        "400":
          description: Invalid input
          schema:
            type: string
        "404":
          description: Song not found
          schema:
            type: string
      summary: Обновить песню
      tags:
      - Songs
swagger: "2.0"
